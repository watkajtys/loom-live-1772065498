<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nightstand - Twilight Slate</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "slate-base": "#121417", 
                        "slate-lighter": "#1a1d23",
                        "slate-darker": "#0e0f11",
                        "lavender-glow": "#e0e7ff",
                        "lavender-muted": "#818cf8",
                    },
                    fontFamily: {
                        "geo": ["Montserrat", "sans-serif"],
                    },
                    backgroundImage: {
                        'twilight-gradient': 'linear-gradient(to bottom, #121417 0%, #1a1d23 100%)',
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        :root {
            --slate-base: #121417;
            --lavender-accent: rgba(224, 231, 255, 0.05);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .clinical-input {
            background: transparent;
            outline: none;
            border: none;
            box-shadow: none;
        }
        .clinical-input::placeholder {
            color: rgba(148, 163, 184, 0.2);
            font-weight: 300;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="bg-slate-base text-slate-300 min-h-screen flex flex-col font-geo antialiased overflow-hidden selection:bg-indigo-200/20 selection:text-white">
<header class="fixed top-0 left-0 w-full z-50 p-8 flex justify-between items-center opacity-60 hover:opacity-100 transition-opacity duration-500">
<div class="flex items-center gap-3 cursor-pointer group">
<span class="material-symbols-outlined text-sm text-slate-400 group-hover:text-white transition-colors">nights_stay</span>
<span class="text-[10px] font-semibold tracking-[0.25em] uppercase text-slate-400 group-hover:text-white transition-colors">Nightstand</span>
</div>
<div class="cursor-pointer group">
<span class="material-symbols-outlined text-xl text-slate-400 group-hover:text-white transition-colors">history</span>
</div>
</header>
<main class="relative flex flex-col w-full h-screen">
<section class="relative z-10 flex-1 flex flex-col items-center justify-end pb-16 w-full bg-[#121417]">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-lg h-64 bg-indigo-500/5 blur-[100px] rounded-full pointer-events-none"></div>
<div class="relative z-10 text-center px-6 max-w-5xl mx-auto space-y-4">
<h1 class="text-3xl md:text-4xl lg:text-5xl font-geo font-light text-slate-100 tracking-[0.05em] leading-tight">
                    What is keeping you awake?
                </h1>
<div class="w-12 h-[1px] bg-indigo-300/20 mx-auto"></div>
</div>
</section>
<div class="w-full h-32 -my-16 z-20 pointer-events-none bg-gradient-to-b from-[#121417] via-[#121417]/90 to-transparent"></div>
<section class="relative z-0 flex-[1.4] w-full bg-gradient-to-b from-[#15181c] to-[#0e0f11] flex flex-col items-center pt-12">
<div class="absolute top-20 left-1/2 -translate-x-1/2 w-2/3 h-40 bg-indigo-400/5 blur-[90px] rounded-full pointer-events-none"></div>
<div class="w-full max-w-4xl px-8 md:px-16 h-full pb-20 relative">
<textarea autofocus="" class="clinical-input w-full h-full text-xl md:text-2xl lg:text-3xl font-geo font-light text-slate-200 placeholder:text-slate-600/40 resize-none text-center leading-relaxed tracking-wide caret-indigo-300 focus:ring-0 p-0 m-0 no-scrollbar bg-transparent" placeholder="Type to offload..." spellcheck="false"></textarea>
<div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#0e0f11] to-transparent pointer-events-none"></div>
</div>
<div class="absolute bottom-10 text-center w-full opacity-30 hover:opacity-60 transition-opacity duration-500 pointer-events-none">
<div class="text-[9px] uppercase tracking-[0.4em] font-semibold text-slate-500">
                    Press <span class="text-indigo-200">Enter</span> to release
                </div>
</div>
</section>
</main>
<div class="fixed inset-0 pointer-events-none opacity-[0.025] z-[60] mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
</body></html>
