<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nightstand - Forest Silence</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "forest-dark": "#0A0F0D", 
                        "forest-deep": "#0e1411",
                        "forest-light": "#131c17", 
                        "moss-grey": "#8a9a8f",
                        "moss-light": "#b8c4be",
                        "moss-dim": "#4a5550",
                    },
                    fontFamily: {
                        "mono": ["'JetBrains Mono'", "monospace"],
                    },
                    backgroundImage: {
                        'forest-gradient': 'linear-gradient(to bottom, #0A0F0D 0%, #0e1411 100%)',
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        :root {
            --forest-base: #0A0F0D;
            --forest-mid: #0e1411;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .liquid-input {
            background: transparent;
            outline: none;
            border: none;
            box-shadow: none;
        }
        .liquid-input::placeholder {
            color: #4a5550;opacity: 0.5;
        }
    </style>
</head>
<body class="bg-forest-dark text-moss-light min-h-screen flex flex-col font-mono antialiased overflow-hidden selection:bg-moss-grey/30 selection:text-white">
<header class="fixed top-0 left-0 w-full z-50 p-8 flex justify-between items-center opacity-60 hover:opacity-100 transition-opacity duration-500">
<div class="flex items-center gap-3 cursor-pointer group">
<span class="material-symbols-outlined text-sm text-moss-grey group-hover:text-white transition-colors">forest</span>
<span class="text-xs font-medium tracking-widest uppercase text-moss-grey group-hover:text-white transition-colors">Nightstand_Mono</span>
</div>
<div class="cursor-pointer group">
<span class="material-symbols-outlined text-xl text-moss-grey group-hover:text-white transition-colors">terminal</span>
</div>
</header>
<main class="relative flex flex-col w-full h-screen">
<section class="relative z-10 flex-1 flex flex-col items-center justify-end pb-16 w-full bg-forest-dark">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-forest-dark z-0 pointer-events-none"></div>
<div class="relative z-10 text-center px-6 max-w-4xl mx-auto space-y-4">
<div class="w-px h-16 bg-gradient-to-b from-transparent via-moss-dim to-transparent mx-auto mb-6 opacity-50"></div>
<h1 class="text-2xl md:text-3xl lg:text-4xl font-normal text-moss-light tracking-tight leading-snug">
                    &gt; What is keeping you awake?
                </h1>
<p class="text-moss-dim text-xs md:text-sm font-light tracking-widest uppercase opacity-80">
                    // Log entry pending...
                </p>
</div>
</section>
<div class="w-full h-32 -my-16 z-20 pointer-events-none bg-gradient-to-b from-forest-dark via-forest-dark/90 to-transparent"></div>
<section class="relative z-0 flex-[1.5] w-full bg-gradient-to-b from-[#0c1210] to-[#050807] flex flex-col items-center pt-12">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-2/3 h-40 bg-emerald-900/5 blur-[100px] rounded-full pointer-events-none"></div>
<div class="w-full max-w-3xl px-6 md:px-12 h-full pb-20 relative">
<textarea autofocus="" class="liquid-input w-full h-full text-lg md:text-xl lg:text-2xl font-light text-moss-light placeholder:text-moss-dim resize-none text-center leading-relaxed caret-moss-grey focus:ring-0 p-0 m-0 no-scrollbar bg-transparent" placeholder="Start typing to ground your thoughts..." spellcheck="false"></textarea>
<div class="absolute bottom-0 left-0 w-full h-40 bg-gradient-to-t from-[#050807] to-transparent pointer-events-none"></div>
</div>
<div class="absolute bottom-10 text-center w-full opacity-30 hover:opacity-70 transition-opacity duration-500 pointer-events-none">
<div class="text-[10px] uppercase tracking-[0.2em] font-medium text-moss-dim font-mono">
                    [Press <span class="text-moss-grey">Enter</span> to Archive]
                </div>
</div>
</section>
</main>
<div class="fixed inset-0 pointer-events-none opacity-[0.04] z-[60] mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<div class="fixed inset-0 pointer-events-none z-[59] opacity-[0.02]" style="background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%;"></div>

</body></html>
