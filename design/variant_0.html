<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nightstand - Midnight Serif</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "midnight": "#05070A",
                        "charcoal": "#1A1D21", 
                        "charcoal-light": "#2C3036",
                        "horizon-top": "#05070A",
                        "horizon-bottom": "#0F1216", 
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                    },
                    backgroundImage: {
                        'midnight-gradient': 'linear-gradient(to bottom, #05070A 0%, #1A1D21 100%)',
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        :root {
            --horizon-top: #05070A;
            --horizon-bottom: #1A1D21;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .liquid-input {
            background: transparent;
            outline: none;
            border: none;
            box-shadow: none;
        }
        .liquid-input::placeholder {
            color: rgba(255, 255, 255, 0.1);
            font-style: italic;
            font-weight: 300;
        }::selection {
            background-color: rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
        }
    </style>
</head>
<body class="bg-midnight text-slate-300 min-h-screen flex flex-col font-serif antialiased overflow-hidden">
<header class="fixed top-0 left-0 w-full z-50 p-8 flex justify-between items-center opacity-30 hover:opacity-80 transition-opacity duration-700">
<div class="flex items-center gap-3 cursor-pointer group">
<span class="material-symbols-outlined text-sm font-light text-slate-500 group-hover:text-slate-300 transition-colors">nightlight</span>
<span class="text-xs font-serif tracking-[0.15em] uppercase text-slate-500 group-hover:text-slate-300 transition-colors">Nightstand</span>
</div>
<div class="cursor-pointer group">
<span class="material-symbols-outlined text-xl font-light text-slate-500 group-hover:text-slate-300 transition-colors">history</span>
</div>
</header>
<main class="relative flex flex-col w-full h-screen">
<section class="relative z-10 flex-1 flex flex-col items-center justify-end pb-16 w-full bg-midnight">
<div class="relative z-10 text-center px-6 max-w-3xl mx-auto space-y-4">
<h1 class="text-5xl md:text-6xl lg:text-7xl font-serif font-medium text-slate-200 tracking-tight leading-tight opacity-90">
                    What is keeping you awake?
                </h1>
<div class="w-12 h-[1px] bg-slate-700/30 mx-auto my-4"></div>
<p class="text-slate-500 text-sm font-serif italic tracking-wide opacity-70">
                    A quiet place for heavy thoughts.
                </p>
</div>
</section>
<div class="w-full h-32 -my-16 z-20 pointer-events-none bg-gradient-to-b from-midnight via-midnight/95 to-transparent"></div>
<section class="relative z-0 flex-[1.4] w-full bg-gradient-to-b from-[#0a0d12] to-charcoal flex flex-col items-center pt-12">
<div class="absolute top-10 left-1/2 -translate-x-1/2 w-1/2 h-32 bg-slate-800/5 blur-[100px] rounded-full pointer-events-none"></div>
<div class="w-full max-w-4xl px-8 md:px-16 h-full pb-20 relative">
<textarea autofocus="" class="liquid-input w-full h-full text-3xl md:text-4xl lg:text-5xl font-serif italic font-light text-slate-300 placeholder:text-slate-700/20 resize-none text-center leading-relaxed caret-slate-600 focus:ring-0 p-0 m-0 no-scrollbar bg-transparent" placeholder="Type your burden here..." spellcheck="false"></textarea>
<div class="absolute bottom-0 left-0 w-full h-40 bg-gradient-to-t from-charcoal to-transparent pointer-events-none"></div>
</div>
<div class="absolute bottom-10 text-center w-full opacity-30 hover:opacity-60 transition-opacity duration-500 pointer-events-none">
<div class="text-[11px] font-serif italic tracking-widest text-slate-500">
                    Press <span class="not-italic font-medium text-slate-400">Enter</span> to rest
                </div>
</div>
</section>
</main>
<div class="fixed inset-0 pointer-events-none opacity-[0.04] z-[60] mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>

</body></html>
